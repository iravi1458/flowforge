spring.application.name=api-service

spring.datasource.url=jdbc:postgresql://localhost:5433/flowforge
spring.datasource.username=flowforge
spring.datasource.password=flowforge

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.data.redis.host=localhost
spring.data.redis.port=6379

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=FlowForge API
info.app.description=Fault-tolerant distributed workflow and job execution engine
